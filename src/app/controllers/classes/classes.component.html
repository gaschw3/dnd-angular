<h1 class="glitch layers">D&D 5e Classes</h1>
<div class="row">
  @if (classes.length) {
    <div class="col-md-2 class-table">
      <app-reference-table
        tableId="tbl-classes"
        [data]="classes"
        [columns]="columns"
        [rowKey]="rowKey"
        [selectedKey]="currClass?.id || null"
        [paging]="false"
        itemLabel="classes"
        (rowClick)="setCurrClass($event)"
      ></app-reference-table>
    </div>
  }
  <div class="col-md-10">
    @if (currClass) {
      <app-level-table (talk)="shake($event)" [dndClass]="currClass"></app-level-table>
    }
  </div>
</div>
@if (currClass) {
  <app-class (talk)="shake($event)" [dndClass]="currClass"></app-class>
}
