@if (archetypes().length) {
  @if (inline()) {
    <div class="archetypes-inline mb-3">
      <span class="archetypes-inline-label">{{ subclassTitle() }}:</span>
      <div class="archetypes-chips">
        @for (archetype of archetypes(); track archetype.shortName) {
          <button
            type="button"
            class="display-chip-btn btn-archetype"
            [class.active]="isSelected(archetype.shortName)"
            [attr.aria-pressed]="isSelected(archetype.shortName)"
            [attr.data-name]="archetype.shortName"
            (click)="toggleArchetype(archetype.shortName)"
          >
            {{ archetype.shortName }}
          </button>
        }
      </div>
      <div class="archetypes-controls">
        <button
          type="button"
          class="btn btn-sm btn-link archetypes-ctrl-btn"
          [disabled]="allSelected()"
          (click)="selectAll()"
        >
          All
        </button>
        <span class="archetypes-sep" aria-hidden="true">·</span>
        <button
          type="button"
          class="btn btn-sm btn-link archetypes-ctrl-btn"
          [disabled]="!hasSelection()"
          (click)="clearAll()"
        >
          Clear
        </button>
      </div>
    </div>
  } @else {
    <div class="archetypes-panel card mb-3">
      <div class="card-body py-2 px-3">
        <div class="d-flex align-items-center justify-content-between gap-2 mb-2">
          <h5 class="archetypes-title mb-0">{{ subclassTitle() }}</h5>
          <div class="archetypes-controls">
            <button
              type="button"
              class="btn btn-sm btn-link archetypes-ctrl-btn"
              [disabled]="allSelected()"
              (click)="selectAll()"
            >
              All
            </button>
            <span class="archetypes-sep" aria-hidden="true">·</span>
            <button
              type="button"
              class="btn btn-sm btn-link archetypes-ctrl-btn"
              [disabled]="!hasSelection()"
              (click)="clearAll()"
            >
              Clear
            </button>
          </div>
        </div>
        <div class="archetypes-chips">
          @for (archetype of archetypes(); track archetype.shortName) {
            <button
              type="button"
              class="display-chip-btn btn-archetype"
              [class.active]="isSelected(archetype.shortName)"
              [attr.aria-pressed]="isSelected(archetype.shortName)"
              [attr.data-name]="archetype.shortName"
              (click)="toggleArchetype(archetype.shortName)"
            >
              {{ archetype.shortName }}
            </button>
          }
        </div>
      </div>
    </div>
  }
}
