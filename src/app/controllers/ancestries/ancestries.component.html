<h1>D&D 5e Ancestries</h1>

<div class="row">
  <div *ngIf="ancestries.length" class="col-sm-4 ancestries-table">
    <app-reference-table
      tableId="tbl-ancestries"
      [data]="ancestries"
      [columns]="columns"
      [rowKey]="rowKey"
      [selectedKey]="currAncestry?.id || null"
      [pageSize]="20"
      [pageSizeOptions]="[20, -1]"
      itemLabel="ancestries"
      defaultSortKey="name"
      (rowClick)="setCurrAncestry($event)"
    ></app-reference-table>
  </div>
  <div class="col-sm-8">
    <app-ancestry *ngIf="currAncestry" [ancestry]="currAncestry"></app-ancestry>
  </div>
</div>
