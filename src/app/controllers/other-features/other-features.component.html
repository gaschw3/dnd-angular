<h1>D&D 5e Features</h1>

<div class="d-flex flex-wrap gap-2 mb-3">
  <button
    type="button"
    class="display-chip-btn"
    [class.active]="selected() === 'all'"
    [attr.aria-pressed]="selected() === 'all'"
    (click)="setFilter('all')"
  >
    All
  </button>
  @for (fType of featureType | keyvalue; track fType.key) {
    @if (!fType.key.includes(':')) {
      <button
        type="button"
        class="display-chip-btn"
        [class.active]="selected() === fType.key"
        [attr.aria-pressed]="selected() === fType.key"
        (click)="setFilter(fType.key)"
      >
        {{ fType.value }}
      </button>
    }
  }
</div>

<div class="row">
  @if (shownFeatures().length) {
    <div class="col otherFeatures-table">
      <app-reference-table
        tableId="tbl-otherFeatures"
        [data]="shownFeatures()"
        [columns]="columns"
        [rowKey]="rowKey"
        [selectedKey]="currFeature()?.name || null"
        [initialFilters]="initialFilters()"
        [pageSize]="10"
        [pageSizeOptions]="[10, 15, 30, 60, -1]"
        itemLabel="features"
        defaultSortKey="name"
        (rowClick)="setCurrFeature($event)"
      ></app-reference-table>
    </div>
  }
</div>

@if (currFeature(); as feature) {
  <app-feature [feature]="feature"></app-feature>
} @else {
  <div class="display-empty-state mt-3">
    <div class="display-empty-title">Select a Feature</div>
    <p>Choose a feature from the table above to view its prerequisites and description.</p>
  </div>
}
