<h1>D&D 5e Features</h1>
<div class="table-type p-3">
  <button class="btn btn-sm btn-primary p-2 m-1" (click)="setFilter('all')" [ngClass]="{'active': selected == 'all'}">All</button>
  <ng-container *ngFor="let fType of featureType | keyvalue">
    <button *ngIf="!fType.key.includes(':')" class="btn btn-sm btn-primary p-2 m-1" role="button" [ngClass]="{'active': selected == fType.key}" (click)="setFilter(fType.key)">{{fType.value}}</button>
  </ng-container>
</div>
<div class="row">
  <div *ngIf="shownFeatures.length" class="col otherFeatures-table">
    <app-reference-table
      tableId="tbl-otherFeatures"
      [data]="shownFeatures"
      [columns]="columns"
      [rowKey]="rowKey"
      [selectedKey]="currFeature?.name || null"
      [initialFilters]="initialFilters"
      [pageSize]="10"
      [pageSizeOptions]="[10, 15, 30, 60, -1]"
      itemLabel="features"
      defaultSortKey="name"
      (rowClick)="setCurrFeature($event)"
    ></app-reference-table>
  </div>
</div>
<app-feature *ngIf="currFeature" [feature]="currFeature"></app-feature>
