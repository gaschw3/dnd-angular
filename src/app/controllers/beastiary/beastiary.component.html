<h1>D&D 5e Beastiary</h1>

<div class="row">
  <div *ngIf="monsters.length" class="col-md-12 beastiary-table">
    <app-reference-table
      tableId="tbl-beastiary"
      [data]="monsters"
      [columns]="columns"
      [rowKey]="rowKey"
      [selectedKey]="currMonster?.id || null"
      [pageSize]="10"
      [pageSizeOptions]="[10, 15, 30, 60, -1]"
      itemLabel="monsters"
      defaultSortKey="name"
      (rowClick)="setCurrMonster($event)"
    ></app-reference-table>
  </div>
</div>
<app-monster *ngIf="currMonster" [monster]="currMonster"></app-monster>
