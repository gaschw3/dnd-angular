<h1>{{ pageHeading }}</h1>

<div class="row g-3 align-items-start">
  @if (feats().length) {
    <div class="col-lg-6 feats-table">
      <app-reference-table
        tableId="tbl-feats"
        [data]="feats()"
        [columns]="columns"
        [rowKey]="rowKey"
        [selectedKey]="currFeat()?.id || null"
        [initialFilters]="initialFilters()"
        [pageSize]="20"
        [pageSizeOptions]="[20, 45, -1]"
        [itemLabel]="itemLabel"
        defaultSortKey="name"
        (rowClick)="setCurrFeat($event)"
      ></app-reference-table>
    </div>
  }
  <div class="col-lg-6">
    @if (currFeat(); as feat) {
      <app-feat [feat]="feat"></app-feat>
    } @else {
      <div class="display-empty-state">
        <div class="display-empty-title">{{ emptyTitle }}</div>
        <p>{{ emptyDescription }}</p>
      </div>
    }
  </div>
</div>
