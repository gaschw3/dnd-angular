@if (feat(); as f) {
  <div class="pb-4">
    <div class="card">
      <div class="card-body">
        <app-detail-header [title]="f.name" [source]="f.source" [change]="f.change" [changeNote]="f.changeNote">
          @if (f.prerequisite) {
            <p detail-description class="mb-0">
              <em>Prerequisite: <span [innerHtml]="f.prerequisite | linkmaker"></span></em>
            </p>
          }
          @if (categoryName()) {
            <span detail-meta class="display-meta-pill">
              <span class="display-meta-label">Type</span>
              <span class="display-meta-value">{{ categoryName() }}</span>
            </span>
          }
          @if (f.asi) {
            <span detail-meta class="display-meta-pill">
              <span class="display-meta-label">ASI</span>
              <span class="display-meta-value">{{ f.asi | titlecaseExcept }}</span>
            </span>
          }
        </app-detail-header>

        <app-entry-renderer [list]="f.text" parent=""></app-entry-renderer>
      </div>
    </div>
  </div>
}
