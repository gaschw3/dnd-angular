@if (item(); as it) {
  <div class="pb-4" [class]="'pb-4 ' + rarityClass()">
    <div class="card">
      <div class="card-body">
        <app-detail-header
          [title]="it.plainName"
          [titleHtml]="it.hasHtmlName ? it.name : undefined"
          [source]="it.source"
        >
          @if (it.subtitleText) {
            <h4 detail-description class="mb-0">
              <em>{{ it.subtitleText }}</em>
            </h4>
          }

          @if (it.valueUnit) {
            <span detail-meta class="display-meta-pill">
              <span class="display-meta-label">Value</span>
              <span class="display-meta-value" [class]="'display-meta-value text--' + it.valueUnit">
                {{ it.valueAmount | number:'1.0':'en-US' }} {{ it.valueUnit }}
              </span>
            </span>
          }
          @if (it.weight) {
            <span detail-meta class="display-meta-pill">
              <span class="display-meta-label">Weight</span>
              <span class="display-meta-value">{{ it.weight }} lbs.</span>
            </span>
          }
          @if (it.ac) {
            <span detail-meta class="display-meta-pill">
              <span class="display-meta-label">AC</span>
              <span class="display-meta-value">{{ it.ac }}</span>
            </span>
          }
          @if (it.damageText) {
            <span detail-meta class="display-meta-pill">
              <span class="display-meta-label">Damage</span>
              <span class="display-meta-value">{{ it.damageText }}</span>
            </span>
          }
        </app-detail-header>

        <div class="feature-text">
          <app-entry-renderer [list]="it.entries" parent=""></app-entry-renderer>
        </div>
      </div>
    </div>
  </div>
}
