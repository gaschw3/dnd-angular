<h1>D&D 5e Items</h1>
<div class="table-type p-3">
  <button class="btn btn-primary p-2 m-1" role="button" [ngClass]="{'active': selected === 'all'}" (click)="setItems('all')">All</button>
  <button class="btn btn-primary p-2 m-1" role="button" [ngClass]="{'active': selected === 'magic'}" (click)="setItems('magic')">Magic Items</button>
  <button class="btn btn-primary p-2 m-1" role="button" [ngClass]="{'active': selected === 'normal'}" (click)="setItems('normal')">Adventuring Supplies</button>
  <button class="btn btn-primary p-2 m-1" role="button" [ngClass]="{'active': selected === 'treasure'}" (click)="setItems('treasure')">Treasure</button>
</div>
<div class="row">
  @if (shownItems.length) {
    <div class="col items-table p-0">
      <app-reference-table
        tableId="tbl-items"
        [data]="shownItems"
        [columns]="columns"
        [rowKey]="rowKey"
        [selectedKey]="currItem ? idPipe.transform(currItem.name) : null"
        [pageSize]="10"
        [pageSizeOptions]="[10, 15, 30, 60, -1]"
        itemLabel="items"
        defaultSortKey="name"
        (rowClick)="setCurrItem($event)"
      ></app-reference-table>
    </div>
  }
</div>
@if (currItem) {
  <app-item [item]="currItem"></app-item>
}
