<h1>D&D 5e Backgrounds</h1>

<div class="row">
  @if (backgrounds().length) {
    <div class="col backgrounds-table">
      <app-reference-table
        tableId="tbl-backgrounds"
        [data]="backgrounds()"
        [columns]="columns"
        [rowKey]="rowKey"
        [selectedKey]="currBackground()?.id || null"
        [pageSize]="10"
        [pageSizeOptions]="[10, 15, 30, 60, -1]"
        itemLabel="backgrounds"
        defaultSortKey="name"
        [syncUrl]="true"
        (rowClick)="setCurrBackground($event)"
      ></app-reference-table>
    </div>
  }
</div>

@if (currBackground(); as background) {
  <app-background [background]="background"></app-background>
} @else {
  <div class="display-empty-state mt-3">
    <div class="display-empty-title">Select a Background</div>
    <p>Choose a background from the table above to view its skills, tools, origin feat, and equipment.</p>
  </div>
}
