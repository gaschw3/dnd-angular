@if (background(); as bg) {
  <div class="pb-4 mt-3">
    <div class="card">
      <div class="card-body">
        <app-detail-header [title]="bg.name" [source]="bg.source">
          @if (bg.info) {
            <p detail-description class="mb-0">{{ bg.info }}</p>
          }
          @if (bg.skill) {
            <span detail-meta class="display-meta-pill">
              <span class="display-meta-label">Skills</span>
              <span class="display-meta-value">{{ bg.skill }}</span>
            </span>
          }
          @if (bg.tool) {
            <span detail-meta class="display-meta-pill">
              <span class="display-meta-label">Tool</span>
              <span class="display-meta-value" [innerHtml]="bg.tool | linkmaker"></span>
            </span>
          }
          @if (bg.feat) {
            <span detail-meta class="display-meta-pill">
              <span class="display-meta-label">Feat</span>
              <span class="display-meta-value" [innerHtml]="bg.feat | linkmaker"></span>
            </span>
          }
        </app-detail-header>

        <div class="row g-3 align-items-start">
          <div [class]="bg.image ? 'col-lg-8' : 'col-12'">
            @if (bg.entries?.length) {
              <app-entry-renderer [list]="bg.entries" parent=""></app-entry-renderer>
            }
          </div>
          @if (bg.image) {
            <div class="col-lg-4">
              <img class="bg-image img-fluid rounded" [src]="bg.image" [alt]="bg.name">
            </div>
          }
        </div>
      </div>
    </div>
  </div>
}
