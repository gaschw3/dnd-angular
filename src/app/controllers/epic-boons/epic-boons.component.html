<h1>D&D 5e Epic Boons</h1>

<div class="row g-3 align-items-start">
  @if (feats().length) {
    <div class="col-lg-6 feats-table">
      <app-reference-table
        tableId="tbl-feats"
        [data]="feats()"
        [columns]="columns"
        [rowKey]="rowKey"
        [selectedKey]="currFeat()?.id || null"
        [initialFilters]="initialFilters()"
        [pageSize]="20"
        [pageSizeOptions]="[20, 45, -1]"
        itemLabel="boons"
        defaultSortKey="name"
        (rowClick)="setCurrBoon($event)"
      ></app-reference-table>
    </div>
  }
  <div class="col-lg-6">
    @if (currFeat(); as boon) {
      <app-feat [feat]="boon"></app-feat>
    } @else {
      <div class="display-empty-state">
        <div class="display-empty-title">Select an Epic Boon</div>
        <p>Choose an epic boon from the list to view its prerequisites, ability score bonuses, and benefits.</p>
      </div>
    }
  </div>
</div>
