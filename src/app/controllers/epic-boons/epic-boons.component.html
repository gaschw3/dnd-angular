<h1>D&D 5e Epic Boons</h1>

<div class="row">
  @if (feats.length) {
    <div class="col-sm-6 feats-table">
      <app-reference-table
        tableId="tbl-feats"
        [data]="feats"
        [columns]="columns"
        [rowKey]="rowKey"
        [selectedKey]="currFeat?.id || null"
        [initialFilters]="initialFilters"
        [pageSize]="20"
        [pageSizeOptions]="[20, 45, -1]"
        itemLabel="boons"
        defaultSortKey="name"
        (rowClick)="setCurrBoon($event)"
      ></app-reference-table>
    </div>
  }
  <div class="col-sm-6">
    @if (currFeat) {
      <app-feat [feat]="currFeat"></app-feat>
    }
  </div>
</div>
