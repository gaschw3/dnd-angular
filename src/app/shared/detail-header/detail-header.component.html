<header class="detail-header">
  <div class="detail-header-left">
    <div class="detail-header-titles">
      @if (titleHtml()) {
        <h2
          class="h1 display-title detail-header-title mb-0"
          [attr.data-phy]="title()"
          [class.text-decoration-line-through]="strikethrough()"
          [innerHtml]="titleHtml()! | sanitizeHtml"
        ></h2>
      } @else {
        <h2
          class="h1 display-title detail-header-title mb-0"
          [attr.data-phy]="title()"
          [class.text-decoration-line-through]="strikethrough()"
        >{{ title() }}</h2>
      }
      @if (subtitle()) {
        <p class="detail-header-subtitle mb-0">{{ subtitle() }}</p>
      }
    </div>
    <div class="detail-header-description">
      <ng-content select="[detail-description]"></ng-content>
    </div>
  </div>
  <div class="detail-header-right">
    <div class="detail-header-meta">
      <ng-content select="[detail-meta]"></ng-content>
      @if (normalizedChange()) {
        <app-change-badge [change]="normalizedChange()" [note]="changeNote()" variant="pill" />
      }
      @if (source()) {
        <span class="display-meta-pill">
          <span class="display-meta-label">Source</span>
          <span class="display-meta-value" [class]="sourceClass()">{{ source() }}</span>
        </span>
      }
    </div>
    <div class="detail-header-actions">
      <ng-content select="[detail-actions]"></ng-content>
    </div>
  </div>
</header>
@if (changeNote()) {
  <div
    class="detail-change-note"
    [class]="'detail-change-note detail-change-note-' + (normalizedChange() || 'change')"
  >
    <strong>{{ changeLabel() }}: </strong><span [innerHtml]="changeNote()! | linkmaker | sanitizeHtml"></span>
  </div>
}
