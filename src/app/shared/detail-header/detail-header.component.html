<header class="detail-header">
  <div class="detail-header-left">
    <div class="detail-header-titles">
      <h2 class="detail-header-title mb-0">{{ title() }}</h2>
      @if (subtitle()) {
        <p class="detail-header-subtitle mb-0">{{ subtitle() }}</p>
      }
    </div>
    <div class="detail-header-description">
      <ng-content select="[detail-description]"></ng-content>
    </div>
  </div>
  <div class="detail-header-right">
    <div class="detail-header-meta">
      <ng-content select="[detail-meta]"></ng-content>
      @if (source()) {
        <span class="display-meta-pill">
          <span class="display-meta-label">Source</span>
          <span class="display-meta-value" [class]="sourceClass()">{{ source() }}</span>
        </span>
      }
    </div>
    <div class="detail-header-actions">
      <ng-content select="[detail-actions]"></ng-content>
    </div>
  </div>
</header>
